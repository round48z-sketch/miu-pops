<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0012">
  <title>MIU POPS</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body class="is-home">
  <audio id="bgm-audio" src="OP.mp3" loop preload="auto"></audio>
  <script>
    (function () {
      var a = document.getElementById("bgm-audio");
      if (!a) return;
      var saved = parseFloat(localStorage.getItem("miu-pops-bgm"));
      a.volume = Number.isFinite(saved) ? Math.max(0, Math.min(1, saved)) : 0.7;
      var p = a.play();
      if (p && p.catch) p.catch(function () {});
    })();
  </script>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="home-ui">
      <div class="logo-panel">
        <h1 class="logo" aria-label="MIU POPS">
          <span class="logo-line logo-line--miu">MIU <span class="logo-heart" aria-hidden="true">♡</span></span>
          <span class="logo-line logo-line--sub">POPS</span>
        </h1>
        <p class="tagline">PINK NEON PUZZLE</p>
      </div>
      <div class="level-select" role="group" aria-label="難易度選択">
        <button type="button" class="level-btn is-active" data-level="1" aria-pressed="true">1</button>
        <button type="button" class="level-btn" data-level="2" aria-pressed="false">2</button>
        <button type="button" class="level-btn" data-level="3" aria-pressed="false">3</button>
        <button type="button" class="level-btn" data-level="4" aria-pressed="false">4</button>
        <button type="button" class="level-btn" data-level="5" aria-pressed="false">5</button>
      </div>
      <button type="button" class="neon-btn neon-btn--settings" id="btn-settings">SETTINGS</button>
      <button type="button" class="neon-btn neon-btn--hero" id="btn-start">START</button>
      <p class="hint">同じ色を4つ以上つなげよう</p>
      </div>

      <div id="boot-splash" class="boot-splash" hidden>
        <p class="boot-splash__title">MIU POPS</p>
        <p class="boot-splash__text">TAP TO START</p>
        <p class="boot-splash__sub">タップして開始</p>
      </div>

      <div id="settings-panel" class="settings-panel" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <button type="button" class="settings-panel__backdrop" id="settings-backdrop" aria-label="設定を閉じる"></button>
        <div class="settings-panel__card">
          <h2 id="settings-title" class="settings-title">SETTINGS</h2>
          <div class="settings-row settings-row--vol">
            <label class="settings-label" for="vol-bgm">BGM</label>
            <div class="settings-vol">
              <input type="range" id="vol-bgm" class="settings-range settings-range--bgm" min="0" max="100" value="70" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-valuetext="BGM音量 70パーセント">
              <div class="settings-meter settings-meter--bgm" aria-hidden="true">
                <div id="vol-bgm-meter" class="settings-meter__fill"></div>
              </div>
            </div>
            <span id="vol-bgm-val" class="settings-val">70%</span>
          </div>
          <div class="settings-row settings-row--vol">
            <label class="settings-label" for="vol-se">SE</label>
            <div class="settings-vol">
              <input type="range" id="vol-se" class="settings-range settings-range--se" min="0" max="100" value="88" aria-valuemin="0" aria-valuemax="100" aria-valuenow="88" aria-valuetext="SE音量 88パーセント">
              <div class="settings-meter settings-meter--se" aria-hidden="true">
                <div id="vol-se-meter" class="settings-meter__fill"></div>
              </div>
            </div>
            <span id="vol-se-val" class="settings-val">88%</span>
          </div>
          <button type="button" class="neon-btn neon-btn--settings-close" id="btn-settings-close">OK</button>
        </div>
      </div>
    </section>

    <!-- GAME -->
    <section id="screen-game" class="screen" data-game-level="1">
      <header class="hud">
        <div class="diff-badge" aria-live="polite">
          <span class="diff-badge-label">LEVEL</span>
          <span id="diff-display" class="diff-badge-value">1</span>
        </div>
        <div class="speed-badge" aria-live="polite">
          <span class="speed-badge-label">SPEED</span>
          <span id="speed-level" class="speed-badge-value">LV 5</span>
        </div>
        <div class="stat-card stat-card--score">
          <span class="stat-crown" aria-hidden="true">♡</span>
          <span class="stat-label">SCORE</span>
          <span id="score" class="stat-value">0</span>
        </div>
        <div class="preview-card" aria-label="次のぷよ">
          <span class="preview-label">NEXT</span>
          <canvas id="next-preview" width="88" height="108" aria-hidden="true"></canvas>
        </div>
      </header>

      <div class="board-wrap">
        <div class="board-shell">
          <div class="board-frame-outer">
            <div class="board-frame">
              <span class="frame-top-neon" aria-hidden="true"></span>
              <span class="frame-crest" aria-hidden="true">♡</span>
              <span class="frame-heart-side frame-heart-side--l" aria-hidden="true">♡</span>
              <span class="frame-heart-side frame-heart-side--r" aria-hidden="true">♡</span>
              <div class="board-frame-inner">
                <div class="board-stage">
                  <canvas id="board-bg" width="360" height="720" aria-hidden="true"></canvas>
                  <canvas id="board" width="360" height="720" aria-label="ゲーム盤面"></canvas>
                  <div id="chain-banner" class="chain-banner" aria-live="polite" hidden>
                    <span class="chain-banner__flash" aria-hidden="true"></span>
                    <span class="chain-banner__burst" aria-hidden="true"></span>
                    <span class="chain-banner__ring" aria-hidden="true"></span>
                    <p class="chain-banner__text"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="controls-panel">
        <div class="controls" aria-label="操作ボタン">
          <button type="button" class="ctrl-btn" id="btn-left" aria-label="左">
            <span class="ctrl-icon" aria-hidden="true">◀</span>
            <span class="ctrl-label">左</span>
          </button>
          <button type="button" class="ctrl-btn ctrl-btn--main" id="btn-down" aria-label="下">
            <span class="ctrl-icon" aria-hidden="true">▼</span>
            <span class="ctrl-label">下</span>
          </button>
          <button type="button" class="ctrl-btn" id="btn-rotate" aria-label="回転">
            <span class="ctrl-icon" aria-hidden="true">↻</span>
            <span class="ctrl-label">回転</span>
          </button>
          <button type="button" class="ctrl-btn" id="btn-right" aria-label="右">
            <span class="ctrl-icon" aria-hidden="true">▶</span>
            <span class="ctrl-label">右</span>
          </button>
        </div>

        <button type="button" class="ctrl-btn ctrl-btn--hard" id="btn-hard-drop" aria-label="急降下">
          <span class="ctrl-icon" aria-hidden="true">⇓</span>
          <span class="ctrl-label">急降下</span>
        </button>

        <div class="action-bar">
          <button type="button" class="neon-btn neon-btn--compact" id="btn-retry">RETRY</button>
          <button type="button" class="home-btn" id="btn-home">HOME</button>
        </div>
      </div>
    </section>

    <!-- GAME OVER -->
    <section id="screen-over" class="screen">
      <div class="game-over-panel">
        <p class="overlay-title">GAME OVER</p>
        <div class="stat-card stat-card--final">
          <span class="stat-label">SCORE</span>
          <p id="final-score" class="stat-value stat-value--final">0</p>
        </div>
        <div class="game-over-actions">
          <button type="button" class="neon-btn" id="btn-retry-over">RETRY</button>
          <button type="button" class="home-btn" id="btn-home-over">HOME</button>
        </div>
      </div>
    </section>
  </div>

  <script src="game.js?v=35"></script>
</body>
</html>
